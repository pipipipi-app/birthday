
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カレンダー | #BirthDay</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #fff7fb;
      color: #5f4b55;
      font-family: sans-serif;
    }

    header {
      padding: 20px;
      background: white;
      border-bottom: 1px solid #f0dce5;
      font-weight: bold;
    }

    .container {
      width: min(94%, 520px);
      margin: 0 auto;
      padding: 24px 0 40px;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 20px 14px;
      box-shadow: 0 4px 20px rgba(150,100,120,.08);
    }

    .title {
      text-align: center;
      color: #9d5475;
      margin: 0 0 20px;
    }

    .month-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .month-bar h2 {
      margin: 0;
      font-size: 21px;
    }

    button {
      cursor: pointer;
      font: inherit;
    }

    .month-button {
      border: 0;
      border-radius: 50%;
      background: #fff0f6;
      color: #9d5475;
      width: 42px;
      height: 42px;
      font-size: 22px;
    }

    .weekdays, .days {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 4px;
    }

    .weekdays div {
      text-align: center;
      padding: 8px 0;
      font-size: 12px;
      color: #9d8290;
    }

    .day {
      min-width: 0;
      min-height: 62px;
      padding: 5px 2px;
      border: 1px solid #f5e7ed;
      border-radius: 10px;
      background: white;
      color: #5f4b55;
      text-align: center;
    }

    .day.other-month {
      background: #faf7f9;
      color: #c7b9c0;
    }

    .day.today {
      border: 2px solid #e9a9c3;
    }

    .day.has-birthday {
      background: #fff0f6;
      border-color: #e9a9c3;
    }

    .day-number {
      display: block;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .birthday-mark {
      display: block;
      color: #b34d7b;
      font-size: 10px;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .birthday-list {
      margin-top: 20px;
      padding: 16px;
      border-radius: 16px;
      background: #fff7fb;
      line-height: 1.8;
    }

    .birthday-list h3 {
      margin: 0 0 8px;
      color: #9d5475;
      font-size: 16px;
    }

    .back-button {
      display: block;
      margin-top: 16px;
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 999px;
      background: #e9a9c3;
      color: white;
      font-weight: bold;
      text-align: center;
      text-decoration: none;
    }

    .status {
      text-align: center;
      line-height: 1.7;
      color: #8b747e;
    }
  </style>
</head>
<body>
  <header>🎂 #BirthDay</header>

  <main class="container">
    <section class="card">
      <h1 class="title">🎀 誕生日カレンダー</h1>

      <div class="month-bar">
        <button id="prevMonth" class="month-button" aria-label="前の月">‹</button>
        <h2 id="monthTitle"></h2>
        <button id="nextMonth" class="month-button" aria-label="次の月">›</button>
      </div>

      <div class="weekdays">
        <div>日</div><div>月</div><div>火</div>
        <div>水</div><div>木</div><div>金</div><div>土</div>
      </div>

      <div id="calendarDays" class="days"></div>

      <div id="birthdayList" class="birthday-list">
        <h3>🎂 誕生日</h3>
        <p class="status">カレンダーを読み込み中...</p>
      </div>

      <p id="status" class="status">友達の誕生日を読み込み中...</p>
    </section>

    <a href="mypage.html" class="back-button">マイページに戻る</a>
  </main>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL =
      "https://tzttjfxnrqzpmcnnqqfw.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_Qca22frc8idrxqshZYX1WQ_27hFQpO1";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const monthTitle = document.getElementById("monthTitle");
    const calendarDays = document.getElementById("calendarDays");
    const birthdayList = document.getElementById("birthdayList");
    const statusText = document.getElementById("status");

    const today = new Date();
    let shownYear = today.getFullYear();
    let shownMonth = today.getMonth();
    let friends = [];

    function birthdayMonthDay(value) {
      if (!value) return null;
      const match = String(value).match(/^\d{4}-(\d{2})-(\d{2})/);
      if (!match) return null;
      return {
        month: Number(match[1]) - 1,
        day: Number(match[2])
      };
    }

    function friendsOnDate(year, month, day) {
      return friends.filter(friend => {
        const birthday = birthdayMonthDay(friend.birthday);
        return birthday &&
          birthday.month === month &&
          birthday.day === day;
      });
    }

    function renderCalendar() {
      monthTitle.textContent =
        shownYear + "年" + (shownMonth + 1) + "月";

      calendarDays.replaceChildren();

      const firstDay = new Date(shownYear, shownMonth, 1);
      const startDay = firstDay.getDay();
      const daysInMonth =
        new Date(shownYear, shownMonth + 1, 0).getDate();

      const previousMonthLastDay =
        new Date(shownYear, shownMonth, 0).getDate();

      for (let i = 0; i < 42; i++) {
        let dayNumber;
        let cellMonth = shownMonth;
        let cellYear = shownYear;
        let otherMonth = false;

        if (i < startDay) {
          dayNumber = previousMonthLastDay - startDay + i + 1;
          cellMonth = shownMonth - 1;
          if (cellMonth < 0) {
            cellMonth = 11;
            cellYear--;
          }
          otherMonth = true;
        } else if (i >= startDay + daysInMonth) {
          dayNumber = i - startDay - daysInMonth + 1;
          cellMonth = shownMonth + 1;
          if (cellMonth > 11) {
            cellMonth = 0;
            cellYear++;
          }
          otherMonth = true;
        } else {
          dayNumber = i - startDay + 1;
        }

        const birthdays = friendsOnDate(
          cellYear, cellMonth, dayNumber
        );

        const button = document.createElement("button");
        button.className = "day";
        if (otherMonth) button.classList.add("other-month");

        if (
          cellYear === today.getFullYear() &&
          cellMonth === today.getMonth() &&
          dayNumber === today.getDate()
        ) {
          button.classList.add("today");
        }

        if (birthdays.length) button.classList.add("has-birthday");

        const number = document.createElement("span");
        number.className = "day-number";
        number.textContent = dayNumber;
        button.appendChild(number);

        if (birthdays.length) {
          const mark = document.createElement("span");
          mark.className = "birthday-mark";
          mark.textContent = "🎂 " + birthdays.length + "人";
          button.appendChild(mark);
        }

        button.addEventListener("click", () => {
          showBirthdays(cellYear, cellMonth, dayNumber);
        });

        calendarDays.appendChild(button);
      }

      showBirthdays(shownYear, shownMonth, 1);
    }

    function showBirthdays(year, month, day) {
      const birthdays = friendsOnDate(year, month, day);
      birthdayList.replaceChildren();

      const heading = document.createElement("h3");
      heading.textContent =
        "🎂 " + (month + 1) + "月" + day + "日の誕生日";
      birthdayList.appendChild(heading);

      if (birthdays.length === 0) {
        const message = document.createElement("p");
        message.textContent = "この日の誕生日の友達はいないよ 🎀";
        birthdayList.appendChild(message);
        return;
      }

      birthdays.forEach(friend => {
        const person = document.createElement("p");
        person.textContent = "🎀 " + friend.name + " さん";
        birthdayList.appendChild(person);
      });
    }

    document.getElementById("prevMonth").addEventListener("click", () => {
      shownMonth--;
      if (shownMonth < 0) {
        shownMonth = 11;
        shownYear--;
      }
      renderCalendar();
    });

    document.getElementById("nextMonth").addEventListener("click", () => {
      shownMonth++;
      if (shownMonth > 11) {
        shownMonth = 0;
        shownYear++;
      }
      renderCalendar();
    });

    async function loadCalendar() {
      const { data: { user }, error: userError } =
        await supabaseClient.auth.getUser();

      if (userError || !user) {
        statusText.textContent = "ログインが必要だよ。";
        return;
      }

      const { data, error } =
        await supabaseClient.rpc("get_my_friends");

      if (error) {
        console.error(error);
        statusText.textContent =
          "友達を読み込めなかったよ。もう一度試してね。";
        return;
      }

      friends = data || [];
      statusText.textContent =
        "友達 " + friends.length + "人の誕生日を確認中";

      renderCalendar();
    }

    loadCalendar();
  </script>
</body>
</html>
