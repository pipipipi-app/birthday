<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>#BirthDay アカウント作成</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #fff7fb;
      font-family: sans-serif;
      color: #5f4b55;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: min(90%, 400px);
      padding: 40px 0;
    }

    h1 {
      text-align: center;
      font-size: 30px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #8b747e;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      border: 1px solid #e5cbd7;
      border-radius: 12px;
      background: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #e9a9c3;
    }

    .create-button {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin-top: 28px;
      padding: 15px;
      border: none;
      border-radius: 999px;
      background: #e9a9c3;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-link {
      text-align: center;
      margin-top: 24px;
      font-size: 14px;
    }

    .login-link a {
      color: #d982a5;
      font-weight: bold;
      text-decoration: none;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 28px;
      color: #9b858e;
      text-decoration: none;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>🎂 #BirthDay</h1>

    <p class="subtitle">
      アカウントを作ろう！
    </p>

    <form>

      <label for="name">
        名前
      </label>

      <input
        type="text"
        id="name"
        placeholder="名前を入力"
        required
      >

      <label for="birthday">
        誕生日
      </label>

      <input
        type="date"
        id="birthday"
        required
      >

      <label for="friendCode">
        友達コード
      </label>

      <input
        type="text"
        id="friendCode"
        placeholder="好きなコードを入力"
        required
      >

      <label for="password">
        パスワード
      </label>

      <input
        type="password"
        id="password"
        placeholder="パスワードを入力"
        required
      >

      <button type="submit" class="create-button">
        アカウントを作る
      </button>

    </form>

    <div class="login-link">
      すでにアカウントを持っている？
      <a href="login.html">ログインする</a>
    </div>

    <a href="index.html" class="back">
      ← はじめの画面に戻る
    </a>

  </main>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://tzttjfxnrqzpmcnnqqfw.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_Qca22frc8idrxqshZYX1WQ_27hFQpO1";
);

console.log("Supabase読み込みOK");

const mySupabase = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  const form = document.querySelector("form");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const name = document.getElementById("name").value.trim();
    const birthday = document.getElementById("birthday").value;
    const friendCode = document.getElementById("friendCode").value.trim();
    const password = document.getElementById("password").value;

    if (!name || !birthday || !friendCode || !password) {
      alert("全部入力してね！");
      return;
    }

    const internalEmail =
      friendCode.toLowerCase() + "@birthday.local";

    const { data, error } = await mySupabase.auth.signUp({
      email: internalEmail,
      password: password,
      options: {
        data: {
          name: name,
          birthday: birthday,
          friend_code: friendCode
        }
      }
    });

    if (error) {
      if (error.message.includes("already registered")) {
        alert("この友達コードはすでに使われています。別のコードにしてね！");
      } else {
        alert("登録できませんでした。\n" + error.message);
      }
      return;
    }

    alert("アカウントを作成しました！🎂");

    window.location.href = "mypage.html";
  });
</script>
</body>
</html>
