
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイページ | #BirthDay</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #fff7fb;
      font-family: sans-serif;
      color: #5f4b55;
    }
    header {
      padding: 20px;
      background: white;
      border-bottom: 1px solid #f0dce5;
      font-weight: bold;
    }
    .container {
      width: min(90%, 500px);
      margin: 0 auto;
      padding: 30px 0 40px;
    }
    .profile, .friends-card {
      background: white;
      border-radius: 24px;
      padding: 25px 20px;
      box-shadow: 0 4px 20px rgba(150, 100, 120, 0.08);
      margin-bottom: 20px;
    }
    .profile { text-align: center; }
    .icon { font-size: 60px; }
    h1 { margin: 10px 0; font-size: 28px; }
    .birthday { margin-top: 8px; }
    .code {
      margin-top: 25px;
      padding: 15px;
      border-radius: 14px;
      background: #fff1f6;
      font-size: 14px;
    }
    .code strong {
      display: block;
      margin-top: 5px;
      font-size: 20px;
      letter-spacing: 2px;
    }
    .add-friend-button, .logout-button {
      display: block;
      box-sizing: border-box;
      width: 100%;
      margin-top: 14px;
      padding: 14px;
      border: none;
      border-radius: 999px;
      text-align: center;
      font-weight: bold;
      font-size: 16px;
      text-decoration: none;
      cursor: pointer;
    }
    .add-friend-button {
      background: #e9a9c3;
      color: white;
    }
    .logout-button {
      background: #f3dce6;
      color: #8a6875;
    }
    .friends-card h2 {
      margin-top: 0;
      font-size: 22px;
      color: #9d5475;
    }
    .friend-item {
      padding: 15px 0;
      border-bottom: 1px solid #f3e3ea;
    }
    .friend-item:last-child { border-bottom: none; }
    .friend-name {
      font-weight: bold;
      font-size: 17px;
    }
    .friend-birthday {
      margin-top: 6px;
      font-size: 14px;
      color: #8b747e;
    }
    .message {
      color: #8b747e;
      text-align: center;
      line-height: 1.7;
    }
    .friend-code {
      margin-top: 5px;
      font-size: 12px;
      color: #a18b95;
    }
  </style>
</head>
<body>
  <header>🎂 #BirthDay</header>

  <main class="container">
    <section class="profile">
      <div class="icon">🎀</div>
      <h1 id="userName">こんにちは！</h1>

      <p class="birthday">
        🎂 誕生日：<span id="userBirthday"></span>
      </p>

      <div class="code">
        あなたの友達コード
        <strong id="friendCode">読み込み中...</strong>
      </div>

      <a href="friends.html" class="add-friend-button">
        ＋ 友達を追加
      </a>

      <button id="logoutButton" class="logout-button">
        ログアウト
      </button>
    </section>

    <section class="friends-card">
      <h2>👯‍♀️ 友達リスト</h2>
      <div id="friendsList" class="message">友達を読み込み中...</div>
    </section>
  </main>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL =
      "https://tzttjfxnrqzpmcnnqqfw.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_Qca22frc8idrxqshZYX1WQ_27hFQpO1";

    const mySupabase = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    async function loadMyPage() {
      const {
        data: { user },
        error
      } = await mySupabase.auth.getUser();

      if (error || !user) {
        alert("ログイン情報が見つかりません。");
        window.location.href = "login.html";
        return;
      }

      const userData = user.user_metadata || {};

      document.getElementById("userName").textContent =
        userData.name ? userData.name + "さん" : "こんにちは！";

      document.getElementById("userBirthday").textContent =
        userData.birthday || "未登録";

      document.getElementById("friendCode").textContent =
        userData.friend_code || "未登録";

      await loadFriends();
    }

    async function loadFriends() {
      const list = document.getElementById("friendsList");
      list.textContent = "友達を読み込み中...";

      const { data, error } = await mySupabase.rpc("get_my_friends");

      if (error) {
        console.error(error);
        list.textContent =
          "友達を読み込めませんでした。ページを再読み込みしてね。";
        return;
      }

      if (!data || data.length === 0) {
        list.textContent =
          "まだ友達がいないみたい！「＋ 友達を追加」から追加してね 🎀";
        return;
      }

      list.className = "";
      list.replaceChildren();

      data.forEach((friend) => {
        const item = document.createElement("div");
        item.className = "friend-item";

        const name = document.createElement("div");
        name.className = "friend-name";
        name.textContent = "🎀 " + (friend.name || "名前未登録") + " さん";

        const birthday = document.createElement("div");
        birthday.className = "friend-birthday";
        birthday.textContent = "🎂 誕生日：" +
          (friend.birthday || "未登録");

        const code = document.createElement("div");
        code.className = "friend-code";
        code.textContent = "友達コード：" +
          (friend.friend_code || "未登録");

        item.append(name, birthday, code);
        list.appendChild(item);
      });
    }

    async function logout() {
      const { error } = await mySupabase.auth.signOut();

      if (error) {
        alert("ログアウトできませんでした。");
        return;
      }

      window.location.href = "login.html";
    }

    document.getElementById("logoutButton")
      .addEventListener("click", logout);

    loadMyPage();
  </script>
</body>
</html>
