<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>マイページ | #BirthDay</title>

  <style>
    .add-friend-button {
  display: block;
  margin-top: 20px;
  padding: 14px;
  border-radius: 999px;
  background: #e9a9c3;
  color: white;
  text-decoration: none;
  font-weight: bold;
}

    body {
      margin: 0;
      min-height: 100vh;
      background: #fff7fb;
      font-family: sans-serif;
      color: #5f4b55;
    }

    header {
      padding: 20px;
      background: white;
      border-bottom: 1px solid #f0dce5;
      font-weight: bold;
    }

    .container {
      width: min(90%, 500px);
      margin: 0 auto;
      padding: 40px 0;
    }

    .profile {
      text-align: center;
      background: white;
      border-radius: 24px;
      padding: 30px 20px;
      box-shadow: 0 4px 20px rgba(150, 100, 120, 0.08);
    }

    .icon {
      font-size: 60px;
    }

    h1 {
      margin: 10px 0;
      font-size: 28px;
    }

    .birthday {
      margin-top: 8px;
    }

    .code {
      margin-top: 25px;
      padding: 15px;
      border-radius: 14px;
      background: #fff1f6;
      font-size: 14px;
    }

    .code strong {
      display: block;
      margin-top: 5px;
      font-size: 20px;
      letter-spacing: 2px;
    }
  </style>
</head>

<body>

  <header>
    🎂 #BirthDay
  </header>

  <main class="container">

    <section class="profile">

      <div class="icon">🎀</div>

      <h1 id="userName">こんにちは！</h1>

      <p class="birthday">
        🎂 誕生日：<span id="userBirthday"></span>
      </p>

      <div class="code">
        あなたの友達コード
        <strong id="friendCode">読み込み中...</strong>
      </div>
      <a href="friends.html" class="add-friend-button">
  ＋ 友達を追加
</a>

    </section>

  </main>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL = "https://tzttjfxnrqzpmcnnqqfw.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_Qca22frc8idrxqshZYX1WQ_27hFQpO1";

  const mySupabase = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  async function loadMyPage() {
    const {
      data: { user },
      error
    } = await mySupabase.auth.getUser();

    if (error || !user) {
      alert("ログイン情報が見つかりません。");
      window.location.href = "login.html";
      return;
    }

    const userData = user.user_metadata;

    document.getElementById("userName").textContent =
      userData.name ? userData.name + "さん" : "こんにちは！";

    document.getElementById("userBirthday").textContent =
      userData.birthday ? userData.birthday : "未登録";

    document.getElementById("friendCode").textContent =
      userData.friend_code ? userData.friend_code : "未登録";
  }

  loadMyPage();
</script>

</body>
</html>
