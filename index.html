<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>#BirthDay</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #fff7fb;
      font-family: sans-serif;
      color: #5f4b55;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .container {
      width: min(90%, 400px);
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .message {
      font-size: 17px;
      line-height: 1.8;
      margin-bottom: 40px;
    }

    .start-button {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 16px;
      border-radius: 999px;
      background: #e9a9c3;
      color: white;
      text-decoration: none;
      font-size: 17px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>🎂 #BirthDay</h1>

    <p class="message">
      大切な人の誕生日を<br>
      もっと特別に。
    </p>

    <a href="login.html" class="start-button" id="startButton">
      はじめる
    </a>

  </main>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://tzttjfxnrqzpmcnnqqfw.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_Qca22frc8idrxqshZYX1WQ_27hFQpO1";

    const mySupabase = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const startButton = document.getElementById("startButton");

    startButton.addEventListener("click", async (event) => {
      event.preventDefault();

      const {
        data: { user }
      } = await mySupabase.auth.getUser();

      if (user) {
        window.location.href = "mypage.html";
      } else {
        window.location.href = "login.html";
      }
    });
  </script>

</body>
</html>
