<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>#BirthDay ログイン</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #fff7fb;
      font-family: sans-serif;
      color: #5f4b55;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: min(90%, 400px);
      text-align: center;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .subtitle {
      margin-bottom: 30px;
      color: #8b747e;
    }

    .form {
      text-align: left;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      border: 1px solid #e5cbd7;
      border-radius: 12px;
      background: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #e9a9c3;
    }

    .login-button {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin-top: 28px;
      padding: 15px;
      border: none;
      border-radius: 999px;
      background: #e9a9c3;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .signup-link {
      margin-top: 24px;
      font-size: 14px;
    }

    .signup-link a {
      color: #d982a5;
      font-weight: bold;
      text-decoration: none;
    }

    .back {
      display: inline-block;
      margin-top: 28px;
      color: #9b858e;
      text-decoration: none;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>🎀 #BirthDay</h1>

    <p class="subtitle">
      おかえりなさい！
    </p>

    <form class="form">

      <label for="friendCode">
        友達コード
      </label>

      <input
        type="text"
        id="friendCode"
        placeholder="友達コードを入力"
        autocomplete="username"
      >

      <label for="password">
        パスワード
      </label>

      <input
        type="password"
        id="password"
        placeholder="パスワードを入力"
        autocomplete="current-password"
      >

      <button type="submit" class="login-button">
        ログイン
      </button>

    </form>

    <div class="signup-link">
      初めての方はこちら
      <a href="signup.html">アカウントを作る</a>
    </div>

    <a href="index.html" class="back">
      ← はじめの画面に戻る
    </a>

  </main>

</body>
</html>
